<svg width="850" height="230" viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research to product journey" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="0.5" stop-color="#302b63"/><stop offset="1" stop-color="#24243e"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="850" height="230" rx="16" fill="url(#bg)"/>
<rect x="1" y="1" width="848" height="228" rx="15" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
<rect x="110" y="96" width="660" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
<rect x="110" y="96" width="0" height="6" rx="3" fill="url(#bar)" filter="url(#glow)"><animate attributeName="width" from="0" to="660" dur="4.5s" begin="0.3s" fill="freeze"/></rect>
<g font-family="Consolas, Menlo, monospace" text-anchor="middle">
<g opacity="0.25"><animate attributeName="opacity" from="0.25" to="1" dur="0.5s" begin="0.3s" fill="freeze"/><circle cx="110" cy="99" r="34" fill="#1b1740" stroke="#a78bfa" stroke-width="2"/><text x="110" y="109" font-size="28">🔬</text><text x="110" y="163" font-size="16" fill="#e9e5ff">Research</text></g>
<g opacity="0.25"><animate attributeName="opacity" from="0.25" to="1" dur="0.5s" begin="1.8s" fill="freeze"/><circle cx="330" cy="99" r="34" fill="#1b1740" stroke="#a78bfa" stroke-width="2"/><text x="330" y="109" font-size="28">🧪</text><text x="330" y="163" font-size="16" fill="#e9e5ff">Prototype</text></g>
<g opacity="0.25"><animate attributeName="opacity" from="0.25" to="1" dur="0.5s" begin="3.3s" fill="freeze"/><circle cx="550" cy="99" r="34" fill="#1b1740" stroke="#a78bfa" stroke-width="2"/><text x="550" y="109" font-size="28">🛡️</text><text x="550" y="163" font-size="16" fill="#e9e5ff">Harden</text></g>
<g opacity="0.25"><animate attributeName="opacity" from="0.25" to="1" dur="0.5s" begin="4.8s" fill="freeze"/><circle cx="770" cy="99" r="34" fill="#1b1740" stroke="#a78bfa" stroke-width="2"/><text x="770" y="109" font-size="28">🚀</text><text x="770" y="163" font-size="16" fill="#e9e5ff">Product</text></g>
<text x="425" y="45" font-size="16" fill="#a78bfa">from research paper to product-grade system</text>
<text x="425" y="204" font-size="13" fill="#a78bfa" fill-opacity="0.8">explainable · real-time · secure by design</text>
</g></svg>