<svg width="850" height="270" viewBox="0 0 850 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Threat detection pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="850" height="270" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="848" height="268" rx="15" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>

  <text x="425" y="42" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#a78bfa">real-time threat detection pipeline</text>

  <!-- connecting lines (animated flow) -->
  <g stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.8" fill="none">
    <line x1="150" y1="135" x2="205" y2="135"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="335" y1="135" x2="390" y2="135"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="520" y1="135" x2="575" y2="135"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="705" y1="135" x2="750" y2="135"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
  </g>

  <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
    <!-- node 1 -->
    <rect x="30" y="95" width="120" height="80" rx="12" fill="url(#node)" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="90" y="128" font-size="26">🌐</text>
    <text x="90" y="156" font-size="12" fill="#e9e5ff">Incoming URL</text>

    <!-- node 2 -->
    <rect x="205" y="95" width="130" height="80" rx="12" fill="url(#node)" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="270" y="128" font-size="26">🔎</text>
    <text x="270" y="156" font-size="12" fill="#e9e5ff">Feature Extract</text>

    <!-- node 3 -->
    <rect x="390" y="95" width="130" height="80" rx="12" fill="url(#node)" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="455" y="128" font-size="26">🧠</text>
    <text x="455" y="156" font-size="12" fill="#e9e5ff">DistilBERT+LGBM</text>

    <!-- node 4 -->
    <rect x="575" y="95" width="130" height="80" rx="12" fill="url(#node)" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="640" y="128" font-size="26">📊</text>
    <text x="640" y="156" font-size="12" fill="#e9e5ff">Risk Score</text>

    <!-- node 5 (verdict, pulsing) -->
    <circle cx="790" cy="135" r="34" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" filter="url(#glow)">
      <animate attributeName="r" values="32;37;32" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="790" y="143" font-size="26">🛡️</text>
  </g>

  <!-- traveling packet -->
  <circle r="6" fill="#c4b5fd" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 90 135 L 270 135 L 455 135 L 640 135 L 790 135"/>
  </circle>

  <g font-family="Consolas, Menlo, monospace" font-size="13" text-anchor="middle" fill="#a78bfa">
    <text x="425" y="230">multi-modal · explainable · milliseconds to verdict</text>
  </g>
</svg>
