name: Generate Terminal Stats

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate terminal stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          GH_USERNAME: rohithvandadi07-ux
        run: python scripts/generate_terminal_stats.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-terminal-stats.svg
          git diff --quiet --cached || git commit -m "chore: update terminal stats"
          git push
