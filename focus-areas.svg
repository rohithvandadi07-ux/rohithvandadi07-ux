<svg width="850" height="330" viewBox="0 0 850 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Focus areas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="850" height="330" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="848" height="328" rx="15" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>

  <!-- window dots -->
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="28" r="6" fill="#27c93f"/>
  <text x="425" y="33" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#a78bfa">rohith@focus:~$ ./show_focus_areas</text>

  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#e9e5ff">
    <!-- row 1 -->
    <text x="40" y="88">AI-driven Cybersecurity</text>
    <rect x="370" y="72" width="440" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="370" y="72" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="430" dur="1.4s" begin="0.2s" fill="freeze"/>
    </rect>

    <!-- row 2 -->
    <text x="40" y="137">Malicious URL Detection</text>
    <rect x="370" y="121" width="440" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="370" y="121" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="402" dur="1.4s" begin="0.4s" fill="freeze"/>
    </rect>

    <!-- row 3 -->
    <text x="40" y="186">Explainable AI (XAI)</text>
    <rect x="370" y="170" width="440" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="370" y="170" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="366" dur="1.4s" begin="0.6s" fill="freeze"/>
    </rect>

    <!-- row 4 -->
    <text x="40" y="235">ROS2 Security</text>
    <rect x="370" y="219" width="440" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="370" y="219" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="384" dur="1.4s" begin="0.8s" fill="freeze"/>
    </rect>

    <!-- row 5 -->
    <text x="40" y="284">Edge AI &amp; Intelligent Systems</text>
    <rect x="370" y="268" width="440" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="370" y="268" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
      <animate attributeName="width" from="0" to="330" dur="1.4s" begin="1s" fill="freeze"/>
    </rect>
  </g>

  <!-- blinking cursor -->
  <rect x="40" y="306" width="10" height="4" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
