<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 344" width="1000" height="344" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset=".5" stop-color="#8f7bff"/><stop offset="1" stop-color="#38d2c0"/></linearGradient></defs><path id="p" d="M125.0 116.0 H875.0" stroke="url(#ln)" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity=".7"/><circle r="5" fill="#fff" filter="url(#glow)"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M125.0 116.0 H875.0"/></circle><circle r="5" fill="#fff" filter="url(#glow)"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M125.0 116.0 H875.0"/></circle><circle r="5" fill="#fff" filter="url(#glow)"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M125.0 116.0 H875.0"/></circle><rect x="30" y="56" width="190" height="120" rx="16" fill="#0b0e17"/><rect x="30" y="56" width="190" height="120" rx="16" fill="none" stroke="#ff5f6d" stroke-opacity=".55"/><rect x="30" y="56" width="190" height="120" rx="16" fill="#ff5f6d" fill-opacity=".07"/><text x="50" y="86" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="11" letter-spacing="3" fill="#ff5f6d">DETECT</text><text x="50" y="120" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#eceef6">ML detection</text><text x="50" y="146" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0b8">XGBoost, Random Forest</text><rect x="30" y="56" width="190" height="120" rx="16" fill="none" stroke="#ff5f6d" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.12;.35;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect><path d="M234 109.0 L266 116.0 L234 123.0" fill="none" stroke="#4a5280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="56" width="190" height="120" rx="16" fill="#0b0e17"/><rect x="280" y="56" width="190" height="120" rx="16" fill="none" stroke="#8f7bff" stroke-opacity=".55"/><rect x="280" y="56" width="190" height="120" rx="16" fill="#8f7bff" fill-opacity=".07"/><text x="300" y="86" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="11" letter-spacing="3" fill="#8f7bff">REASON</text><text x="300" y="120" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#eceef6">Five AI agents</text><text x="300" y="146" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0b8">investigate, plan, recover</text><rect x="280" y="56" width="190" height="120" rx="16" fill="none" stroke="#8f7bff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.12;.35;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></rect><path d="M484 109.0 L516 116.0 L484 123.0" fill="none" stroke="#4a5280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="56" width="190" height="120" rx="16" fill="#0b0e17"/><rect x="530" y="56" width="190" height="120" rx="16" fill="none" stroke="#ffb347" stroke-opacity=".55"/><rect x="530" y="56" width="190" height="120" rx="16" fill="#ffb347" fill-opacity=".07"/><text x="550" y="86" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="11" letter-spacing="3" fill="#ffb347">DECIDE</text><text x="550" y="120" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#eceef6">Dual-risk policy</text><text x="550" y="146" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0b8">act, or ask a human</text><rect x="530" y="56" width="190" height="120" rx="16" fill="none" stroke="#ffb347" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.12;.35;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></rect><path d="M734 109.0 L766 116.0 L734 123.0" fill="none" stroke="#4a5280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="780" y="56" width="190" height="120" rx="16" fill="#0b0e17"/><rect x="780" y="56" width="190" height="120" rx="16" fill="none" stroke="#38d2c0" stroke-opacity=".55"/><rect x="780" y="56" width="190" height="120" rx="16" fill="#38d2c0" fill-opacity=".07"/><text x="800" y="86" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="11" letter-spacing="3" fill="#38d2c0">AUDIT</text><text x="800" y="120" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#eceef6">Immutable log</text><text x="800" y="146" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0b8">Hyperledger Fabric</text><rect x="780" y="56" width="190" height="120" rx="16" fill="none" stroke="#38d2c0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.12;.35;1" dur="6s" begin="3.6s" repeatCount="indefinite"/></rect><text x="30" y="226" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#38d2c0">WHY IT MATTERS</text><text x="30" y="254" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#cfd3e6">An infusion pump under ransomware should not simply be isolated. The policy layer weighs the cyber risk</text><text x="30" y="276" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#cfd3e6">against how critical the device is to the patient, takes non-disruptive containment first, and</text><text x="30" y="298" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#cfd3e6">escalates to a human before any disruptive action.</text><text x="30" y="326" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="11.5" fill="#6b7390">Research prototype. Part of the data is synthetic and the clinical context and LLM agents are stand-ins.</text></svg>