ow)"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.26s" repeatCount="indefinite"/></circle><circle cx="76" cy="72" r="4.5" fill="#8f7bff" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.44s" repeatCount="indefinite"/></circle><text x="28" y="136" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#eceef6">AI / ML</text><text x="28" y="170" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">Models, detection and reasoning.</text><text x="28" y="192" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">PyTorch, HuggingFace, XGBoost,</text><text x="28" y="214" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">YOLOv8 and LLM-powered apps.</text><rect x="340.5" y=".5" width="320" height="249" rx="16" fill="#0b0e17" stroke="#1f2540"/><rect x="340.5" y=".5" width="320" height="249" rx="16" fill="url(#g1)"/><path d="M398 28 L426 38 V62 C426 80 412 90 398 96 C384 90 370 80 370 62 V38 Z" fill="#ff5f6d" fill-opacity=".12" stroke="#ff5f6d" stroke-width="2"/><clipPath id="sh"><path d="M398 28 L426 38 V62 C426 80 412 90 398 96 C384 90 370 80 370 62 V38 Z"/></clipPath><g clip-path="url(#sh)"><rect x="368" y="28" width="60" height="4" fill="#ff5f6d" filter="url(#glow)"><animate attributeName="y" values="28;94;28" dur="3s" repeatCount="indefinite"/></rect></g><path d="M387 62 L395 71 L411 52" fill="none" stroke="#ff5f6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="136" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#eceef6">Cybersecurity</text><text x="368" y="170" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">Threat and anomaly detection,</text><text x="368" y="192" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">IoMT and ROS 2 security,</text><text x="368" y="214" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">LLM jailbreak and PII protection.</text><rect x="680.5" y=".5" width="320" height="249" rx="16" fill="#0b0e17" stroke="#1f2540"/><rect x="680.5" y=".5" width="320" height="249" rx="16" fill="url(#g2)"/><path d="M726 42 L710 62 L726 82" fill="none" stroke="#38d2c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M752 42 L768 62 L752 82" fill="none" stroke="#38d2c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="735" y="50" width="6" height="24" rx="2" fill="#38d2c0" filter="url(#glow)"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect><text x="708" y="136" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#eceef6">Full-stack</text><text x="708" y="170" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">FastAPI, React, PostgreSQL, Docker.</text><text x="708" y="192" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">From a trained model to a product</text><text x="708" y="214" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0b8">people can actually use.</text></svg>